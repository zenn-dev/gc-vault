version: 2

project_name: gc-vault

before:
  hooks:
    - go mod tidy

builds:
  - id: gc-vault
    main: ./cmd/gc-vault
    binary: gc-vault
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zenn-dev/gc-vault/internal/version.Version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - examples/config.toml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - name: gc-vault
    repository:
      owner: zenn-dev
      name: homebrew-tap
      branch: main
      # Push over SSH with a deploy key (write access to homebrew-tap only).
      git:
        url: "git@github.com:zenn-dev/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://github.com/zenn-dev/gc-vault
    description: "Run GCP tools with short-lived impersonated credentials sourced from 1Password"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # Don't push prerelease tags (e.g. v0.1.0-rc.1) to the tap.
    skip_upload: auto
    # The binary is not signed / notarized, so strip the quarantine attribute
    # to keep Gatekeeper from blocking it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gc-vault"]
          end
    caveats: |
      gc-vault requires the following CLIs at runtime:
        - gcloud: brew install --cask gcloud-cli
        - op (1Password CLI): brew install --cask 1password-cli
      Enable "Integrate with 1Password CLI" in the 1Password app
      (Settings > Developer).
