version: 2

project_name: gc-vault

before:
  hooks:
    - go mod tidy

builds:
  - id: gc-vault
    main: ./cmd/gc-vault
    binary: gc-vault
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zenn-dev/gc-vault/internal/version.Version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - examples/config.toml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch

release:
  draft: true
  prerelease: auto
